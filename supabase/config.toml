# Supabase CLI config (local development). Production settings are managed in the dashboard.
project_id = "classquest"

[api]
schemas = ["public"]
max_rows = 200 # pagination guard

[db]
major_version = 17

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://classquest.pages.dev"]
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
skip_nonce_check = false

[storage]
file_size_limit = "2MiB"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

name: Keep Supabase active
# Supabase Free pauses projects after ~1 week without activity (ADR-0002). A trivial query twice a week prevents that.
on:
  schedule:
    - cron: '17 2 * * 1,4' # Mon & Thu 09:17 Asia/Bangkok
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Skip when not configured
        id: cfg
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: echo "configured=$([ -n "$SUPABASE_DB_URL" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Ping database
        if: steps.cfg.outputs.configured == 'yes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select 1" > /dev/null
